<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="12" fill="#08151c"/>
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- Concentric radar waves -->
  <circle cx="24" cy="24" r="14" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="24" cy="24" r="9" stroke="#0ea5e9" stroke-opacity="0.45" stroke-width="2"/>
  <!-- Radar sweep line & beacon center -->
